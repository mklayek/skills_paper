<div id="rtoolbar">
  <span class="title">🌏 FWI · Southern Korea</span>
  <div class="grp">
    <button id="dockbtn" class="on" onclick="rToggleDock()" title="Show or hide the contents sidebar">☰ Contents</button>
    <button onclick="window.print()" title="Print or save as PDF">🖨️ Print / PDF</button>
    <button id="fwbtn" onclick="rToggleWidth()" title="Toggle full-width layout">↔️ Full width</button>
    <button onclick="rFont(-1)" title="Smaller text">A−</button>
    <button onclick="rFont(1)" title="Larger text">A+</button>
    <button onclick="rTop()" title="Back to top">⤒ Top</button>
    <button onclick="rReset()" title="Reset view">🔄 Reset</button>
  </div>
  <span class="hint">🔍 click any figure to zoom · scroll to zoom in the viewer</span>
</div>
<main id="rmain">
